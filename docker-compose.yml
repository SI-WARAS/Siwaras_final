version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: siwaras-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_USER: user_db
      MARIADB_PASSWORD: password_db
      MARIADB_DATABASE: siwaras
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  app:
    image: php:8.1-fpm
    container_name: siwaras-app
    volumes:
      - ./backend/laravel-backend:/var/www/html
      - ./backend/laravel-backend/vendor:/var/www/html/vendor
    working_dir: /var/www/html
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    container_name: siwaras-web
    ports:
      - '8000:80'
    volumes:
      - ./backend/laravel-backend:/var/www/html
      - ./backend/laravel-backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mariadb_data:
